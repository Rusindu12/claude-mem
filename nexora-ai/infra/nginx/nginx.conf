worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 16384;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  client_max_body_size 25m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml;

  # Edge IP Rate Limiting Zones
  limit_req_zone $binary_remote_addr zone=auth_zone:20m rate=15r/m;
  limit_req_zone $binary_remote_addr zone=api_zone:40m rate=180r/m;

  upstream nexora_api_cluster {
    least_conn;
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 512;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Auth Abuse Protection
    location ~ ^/api/v1/auth/(login|register|forgot-password) {
      limit_req zone=auth_zone burst=10 nodelay;
      proxy_pass http://nexora_api_cluster;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE Token Streaming (Disable Buffering!)
    location ~ ^/api/v1/chat/conversations/.*/stream$ {
      proxy_pass http://nexora_api_cluster;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
    }

    # REST API & Swagger Docs
    location /api/ {
      limit_req zone=api_zone burst=60 nodelay;
      proxy_pass http://nexora_api_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO / WebSocket Gateway
    location /socket.io/ {
      proxy_pass http://nexora_api_cluster;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # Static Web App SPA Fallback
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
