# ==============================================================================
# NEXORA AI — 10,000 Concurrent User Horizontal Scaling Override (docker-compose.scale.yml)
# Usage: docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --scale api=8
# Recommended Host Hardware: 8-16 vCPU, 16-32 GB RAM, NVMe SSD
# ==============================================================================
version: '3.9'

services:
  postgres:
    command: postgres -c max_connections=300 -c shared_buffers=2GB -c work_mem=16MB

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1-p0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nexora_app}:${POSTGRES_PASSWORD:-change_me_pg_secret}@postgres:5432/${POSTGRES_DB:-nexora_ai}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 12000
      DEFAULT_POOL_SIZE: 100
      RESERVE_POOL_SIZE: 25
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  api:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexora_app}:${POSTGRES_PASSWORD:-change_me_pg_secret}@pgbouncer:5432/${POSTGRES_DB:-nexora_ai}
      DB_POOL_MAX: 25
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      replicas: 8
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    depends_on:
      - pgbouncer
