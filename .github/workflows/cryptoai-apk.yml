name: CryptoAI Android APK
on:
  push:
    branches: [arena/3fcac268-claude-mem]
    paths:
      - 'apps/cryptoai/**'
      - '.github/workflows/cryptoai-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cryptoai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npx cap add android && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoAI-PRO-debug-apk
          path: apps/cryptoai/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
