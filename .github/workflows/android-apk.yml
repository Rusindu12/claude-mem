# Builds a debug APK on every push / manually, and a signed release APK when
# the signing secrets are configured.
#
#   Repo → Settings → Secrets and variables → Actions
#     KEYSTORE_BASE64      base64 of your release keystore (.jks)
#     KEYSTORE_PASSWORD    store password
#     KEY_ALIAS            key alias
#     KEY_PASSWORD         key password
#
# Download the APK from the run's "Artifacts" section.

name: Android APK

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Backend base URL baked into the APK"
        required: false
        default: "http://10.0.2.2:8000/"
      release:
        description: "Also build a signed release APK (needs signing secrets)"
        type: boolean
        required: false
        default: false
  push:
    branches: ["**"]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Job-level so the per-step `if:` conditions can see it too.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (provides the wrapper generator + build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Diagnose runner
        run: |
          echo "::notice::ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset} user=$(id -un)"
          for d in /usr/local/lib/android/sdk "$ANDROID_HOME" "$ANDROID_SDK_ROOT"; do
            if [ -n "$d" ] && [ -d "$d" ]; then
              echo "::notice::SDK candidate '$d' writable=$([ -w "$d" ] && echo yes || echo no) -> $(ls -1 "$d" 2>/dev/null | tr '\n' ' ')"
            fi
          done
          which java && java -version 2>&1 | head -2
          which gradle && gradle --version | head -5 || true

      # Installs the SDK into a directory the runner user owns. The hosted image
      # ships the command-line tools under /usr/local (root-owned), so we copy
      # those and let sdkmanager write into $HOME instead of fighting privileges.
      - name: Configure Android SDK
        shell: bash
        run: |
          set -x
          trap 'code=$?; echo "::error::SDK setup failed at line $LINENO (exit $code)"; exit $code' ERR
          set -euo pipefail

          STOCK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          if [ -d "$STOCK/cmdline-tools/latest" ]; then
            echo "::notice::copying command-line tools from $STOCK"
            cp -a "$STOCK/cmdline-tools/latest" "$SDK/cmdline-tools/latest"
          elif [ -d "$STOCK/cmdline-tools" ]; then
            echo "::notice::copying command-line tools (non-latest layout)"
            cp -a "$STOCK/cmdline-tools" "$SDK/cmdline-tools/raw"
            mv "$SDK/cmdline-tools/raw" "$SDK/cmdline-tools/latest"
          else
            echo "::notice::downloading command-line tools"
            curl -fsSL --retry 3 --max-time 300 \
              -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"
          echo "::notice::sdkmanager=$SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "sdk.dir=$SDK" > android-app/local.properties
          echo "::notice::Android SDK ready at $SDK"

      - name: Generate the Gradle wrapper
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      # Non-blocking: this job exists to deliver an installable APK even when a
      # formatting assertion fails. Fix real failures — don't ignore them.
      - name: Unit tests (non-blocking)
        continue-on-error: true
        working-directory: android-app
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        working-directory: android-app
        run: |
          ./gradlew :app:assembleDebug \
            -PrsaiBaseUrl="${{ github.event.inputs.base_url || 'http://10.0.2.2:8000/' }}" \
            --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rs-ai-trader-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Restore the release keystore
        if: ${{ github.event.inputs.release == 'true' && env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android-app/rsai-release.jks
          cat > android-app/keystore.properties <<EOF
          storeFile=../rsai-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        if: ${{ github.event.inputs.release == 'true' && env.KEYSTORE_BASE64 != '' }}
        working-directory: android-app
        run: |
          ./gradlew :app:assembleRelease \
            -PrsaiBaseUrl="${{ github.event.inputs.base_url || 'http://10.0.2.2:8000/' }}" \
            --console=plain

      - name: Verify release signature
        if: ${{ github.event.inputs.release == 'true' && env.KEYSTORE_BASE64 != '' }}
        run: |
          apksigner verify --verbose --print-certs \
            android-app/app/build/outputs/apk/release/*.apk | head -20

      - name: Upload signed release APK
        if: ${{ github.event.inputs.release == 'true' && env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rs-ai-trader-release-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Rebuild backend test suites (fast guard)
        run: |
          python -m pip install --quiet -r backend/requirements.txt -r backend/requirements-dev.txt
          cd backend && python -m pytest tests -q -p no:warnings
