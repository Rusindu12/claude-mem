# Builds a debug APK on every push / manually, and a signed release APK when
# the signing secrets are configured.
#
#   Repo → Settings → Secrets and variables → Actions
#     KEYSTORE_BASE64      base64 of your release keystore (.jks)
#     KEYSTORE_PASSWORD    store password
#     KEY_ALIAS            key alias
#     KEY_PASSWORD         key password
#
# Download the APK from the run's "Artifacts" section.

name: Android APK

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Backend base URL baked into the APK"
        required: false
        default: "http://10.0.2.2:8000/"
      release:
        description: "Also build a signed release APK (needs signing secrets)"
        type: boolean
        required: false
        default: false
  push:
    branches: ["**"]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Job-level so the per-step `if:` conditions can see it too.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (provides the wrapper generator + build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      # Works with either the preinstalled SDK on the runner image or a fresh
      # download of the command-line tools, so the job does not depend on a
      # third-party setup action being healthy.
      - name: Diagnose runner
        run: |
          echo "::notice::ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          for d in /usr/local/lib/android/sdk "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/android-sdk"; do
            if [ -n "$d" ] && [ -d "$d" ]; then
              echo "::notice::SDK candidate '$d' -> $(ls -1 "$d" 2>/dev/null | tr '\n' ' ')"
            fi
          done
          which java && java -version 2>&1 | head -2
          which gradle && gradle --version | head -5 || true

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          mkdir -p "$SDK"
          SDKMANAGER="$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::notice::sdkmanager missing under $SDK — downloading command-line tools"
            URL=""
            for build in 11076708 9477386; do
              candidate="https://dl.google.com/android/repository/commandlinetools-linux-${build}_latest.zip"
              if curl -fsSLI --max-time 60 "$candidate" >/dev/null 2>&1; then URL="$candidate"; break; fi
            done
            if [ -z "$URL" ]; then
              echo "::error::Could not download Android command-line tools"; exit 1
            fi
            echo "::notice::Downloading $URL"
            curl -fsSL --retry 3 -o /tmp/cmdline-tools.zip "$URL"
            rm -rf "$SDK/cmdline-tools"
            mkdir -p "$SDK/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          chmod +x "$SDKMANAGER"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          if ! "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -8; then
            echo "::error::sdkmanager failed to install platform 35 / build-tools 35"
            exit 1
          fi
          ls -1 "$SDK" || true
          echo "sdk.dir=$SDK" > android-app/local.properties   # git-ignored
          echo "::notice::Android SDK ready at $SDK"

      - name: Generate the Gradle wrapper
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      # Non-blocking: this job exists to deliver an installable APK even when a
      # formatting assertion fails. Fix real failures — don't ignore them.
      - name: Unit tests (non-blocking)
        continue-on-error: true
        working-directory: android-app
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        working-directory: android-app
        run: |
          ./gradlew :app:assembleDebug \
            -PrsaiBaseUrl="${{ github.event.inputs.base_url || 'http://10.0.2.2:8000/' }}" \
            --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rs-ai-trader-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Restore the release keystore
        if: ${{ github.event.inputs.release == 'true' && env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android-app/rsai-release.jks
          cat > android-app/keystore.properties <<EOF
          storeFile=../rsai-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        if: ${{ github.event.inputs.release == 'true' && env.KEYSTORE_BASE64 != '' }}
        working-directory: android-app
        run: |
          ./gradlew :app:assembleRelease \
            -PrsaiBaseUrl="${{ github.event.inputs.base_url || 'http://10.0.2.2:8000/' }}" \
            --console=plain

      - name: Verify release signature
        if: ${{ github.event.inputs.release == 'true' && env.KEYSTORE_BASE64 != '' }}
        run: |
          apksigner verify --verbose --print-certs \
            android-app/app/build/outputs/apk/release/*.apk | head -20

      - name: Upload signed release APK
        if: ${{ github.event.inputs.release == 'true' && env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rs-ai-trader-release-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Rebuild backend test suites (fast guard)
        run: |
          python -m pip install --quiet -r backend/requirements.txt -r backend/requirements-dev.txt
          cd backend && python -m pytest tests -q -p no:warnings
