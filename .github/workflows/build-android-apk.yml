name: Build Polymarket BTC Bot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'polymarket-btc-bot/android-webview/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: polymarket-btc-bot/android-webview
        run: gradle assembleDebug

      - name: Rename APK
        run: cp polymarket-btc-bot/android-webview/app/build/outputs/apk/debug/app-debug.apk polymarket-btc-bot.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-btc-bot-apk
          path: polymarket-btc-bot.apk

      - name: Publish Direct Download Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0-apk -y || true
          gh release create v1.0.0-apk polymarket-btc-bot.apk \
            --target "${{ github.sha }}" \
            --title "Polymarket BTC Bot APK (v1.0.0)" \
            --notes "Direct Android APK download for Polymarket 5m BTC Up/Down Bot & Dashboard."
