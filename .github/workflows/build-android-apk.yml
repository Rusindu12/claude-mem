name: Build Polymarket BTC Bot Android APK

on:
  workflow_dispatch:
    inputs:
      dashboard_url:
        description: 'Default Dashboard URL baked into the APK (can also be changed in-app)'
        required: false
        default: 'http://10.0.2.2:3000'
  push:
    paths:
      - 'polymarket-btc-bot/android-webview/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: polymarket-btc-bot/android-webview
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-btc-bot-apk
          path: polymarket-btc-bot/android-webview/app/build/outputs/apk/debug/app-debug.apk
