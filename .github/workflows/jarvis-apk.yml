name: Build J.A.R.V.I.S APK

on:
  push:
    paths:
      - 'jarvis/**'
      - '.github/workflows/jarvis-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: jarvis
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp jarvis/app/build/outputs/apk/debug/app-debug.apk JARVIS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: JARVIS.apk

      - name: Publish downloadable APK (pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jarvis-apk --cleanup-tag --yes || true
          gh release create jarvis-apk JARVIS.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "J.A.R.V.I.S APK" \
            --notes "Automated build of the J.A.R.V.I.S Android app from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Download JARVIS.apk and install it on your phone."
