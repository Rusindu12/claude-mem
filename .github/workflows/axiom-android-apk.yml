name: Build Axiom Android APK

on:
  push:
    branches: ['arena/**']
    paths:
      - 'agent/**'
      - '.github/workflows/axiom-android-apk.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Optional hosted Axiom server URL (leave empty for standalone on-device mode)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure pre-installed Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Install dependencies & build web client
        working-directory: agent
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Configure Capacitor & build Android APK
        working-directory: agent
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          if [ -n "$SERVER_URL" ]; then
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
              cfg.server = { url: process.env.SERVER_URL, cleartext: true };
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            "
          fi
          npx cap add android
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../axiom-studio.apk
          ls -lh ../axiom-studio.apk

      - name: Upload Axiom Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axiom-studio-debug-apk
          path: agent/axiom-studio.apk
          retention-days: 30

      - name: Publish downloadable APK (pre-release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view axiom-studio-apk >/dev/null 2>&1; then
            gh release upload axiom-studio-apk agent/axiom-studio.apk --clobber
          else
            gh release create axiom-studio-apk agent/axiom-studio.apk \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "Axiom Studio Android APK" \
              --notes "Axiom Studio Capacitor Android APK (runs standalone on-device with Axiom Native AI, or connects to an Axiom server)."
          fi
