org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------
# Backend endpoint used by the app. Override per build:
#   ./gradlew assembleDebug -PrsaiBaseUrl=http://10.0.2.2:8000/
# 10.0.2.2 is the Android emulator alias for the host machine.
# For a physical phone on the same Wi-Fi use your computer's LAN IP, e.g.
# http://192.168.1.20:8000/  and add that origin to ALLOWED_ORIGINS if needed.
rsaiBaseUrl=http://10.0.2.2:8000/
