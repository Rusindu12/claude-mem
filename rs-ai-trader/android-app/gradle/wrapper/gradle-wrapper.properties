# Gradle wrapper configuration.
#
# The wrapper JAR and the gradlew scripts are NOT committed: they could not be
# generated in the environment where this project was written (no JDK/Gradle).
# Generate them once on a machine with a JDK 17:
#
#   cd android-app
#   gradle wrapper --gradle-version 8.9 --distribution-type bin
#
# Android Studio does the same automatically when you open the project.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
