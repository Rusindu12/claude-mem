# Alembic configuration for RS AI TRADER.
#
#   cd backend
#   alembic -c alembic.ini upgrade head      # apply migrations
#   alembic -c alembic.ini downgrade base    # drop everything (dev only!)
#   alembic -c alembic.ini current
#
# The database URL is read from DATABASE_URL (see database/migrations/env.py),
# so it never needs to be written into this file.

[alembic]
script_location = ../database/migrations
prepend_sys_path = .
version_path_separator = os
# Timestamps in generated revision files use UTC.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
