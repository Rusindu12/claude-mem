plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rusindu.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId "com.rusindu.jarvis"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
